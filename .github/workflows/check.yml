name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --single-threaded --single-threaded-gc tools/bench.mjs --engine wasm --work-budget 1000000 --budgets 256 --iterations 120
      - run: npm run bundle
      - run: node --check dist/worker.js
